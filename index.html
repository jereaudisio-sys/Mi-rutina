<style>
:root{
  --bg:#0f1012; --panel:#17191c; --panel2:#1f2226; --line:#2a2e33;
  --text:#f2f2ee; --mute:#8d939a; --acc:#d4ff3a; --acc-ink:#11140a;
  --warn:#ff6b4a; --good:#5be38b; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:16px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",sans-serif;letter-spacing:.3px;margin:0}
h1{font-size:34px;font-weight:800;text-transform:uppercase;line-height:1}
.motto{cursor:pointer;user-select:none}
.motto .who{font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.motto h1{font-size:30px;line-height:1.02;text-wrap:balance}
.motto h1 em{font-style:normal;color:var(--acc)}
.motto.pop h1{animation:pop .35s ease}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
h2{font-size:24px;font-weight:700}
.mute{color:var(--mute)}
.small{font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:40px}
.top .grow{flex:1;min-width:0}
.top h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.btn.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-family:"Barlow Condensed";font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.btn.block{width:100%;display:block}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center}
.status{position:fixed;top:10px;right:12px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);z-index:50;transition:opacity .3s}
.status.hide{opacity:0}
/* home */
.routine-card{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.thumb{width:62px;height:62px;border-radius:10px;object-fit:cover;background:var(--panel2);flex:none;border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;color:var(--mute)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.empty{text-align:center;padding:36px 18px}
.empty .big{font-family:"Barlow Condensed";font-size:26px;font-weight:700;margin:10px 0 6px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.add{color:var(--acc);border-style:dashed}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:9px 12px;font-weight:600;color:var(--mute);white-space:nowrap}
.tab.on{background:var(--panel2);color:var(--text)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);font-weight:600;margin:18px 0 8px}
/* exercise */
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-family:"Barlow Condensed";font-size:22px;font-weight:700;line-height:1.1}
.presc{font-family:"Barlow Condensed";font-size:18px;color:var(--acc);font-weight:700;white-space:nowrap}
.notes{font-size:13px;color:var(--mute);margin-top:3px}
.sets{margin-top:12px;display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mute)}
.sets.x{grid-template-columns:auto 1fr 1fr 34px}
.sets .rm{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--warn);display:grid;place-items:center;font-size:16px;line-height:1}
.sets .n{font-family:"Barlow Condensed";font-weight:700;color:var(--mute);width:28px;font-size:18px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:18px;font-weight:600;text-align:center;outline:none}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:#555b62;font-weight:500}
.ex-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)}
.spark{display:block}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:600;font-size:14px;padding:4px 0}
.vid{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 12px 7px 9px;border-radius:99px;background:rgba(255,60,60,.12);color:#ff7a6b;font-size:14px;font-weight:600;text-decoration:none;border:1px solid rgba(255,90,80,.25)}
.blk{font-family:"Barlow Condensed";font-weight:800;font-size:15px;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:inline-grid;place-items:center;color:var(--mute);flex:none}
.ss{border-radius:var(--r);border:1px solid var(--ssc);background:color-mix(in srgb,var(--ssc) 7%,transparent);padding:10px}
.ss-head{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.ss-head .t{font-family:"Barlow Condensed";font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.6px;color:var(--ssc)}
.ss .blk{background:var(--ssc);color:var(--acc-ink);border-color:var(--ssc)}
.ss>.card+.card{margin-top:10px}
.ss .card{border-left:3px solid var(--ssc)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .big{font-family:"Barlow Condensed";font-size:28px;font-weight:800;line-height:1;color:var(--acc)}
.tile .t{font-weight:600;margin-top:4px}
.rec{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#ffd23f;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.35);border-radius:99px;padding:2px 8px}
.plist button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.plist .kg{font-family:"Barlow Condensed";font-size:24px;font-weight:800;white-space:nowrap}
.search{margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .dh{font-size:11px;color:var(--mute);text-align:center;text-transform:uppercase;font-weight:600}
.cal .c{aspect-ratio:1;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px;padding:0}
.cal .c.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.cal .c.today{border-color:var(--text)}
.cal .c small{font-size:9px;font-weight:700;line-height:1;margin-top:2px;opacity:.75;max-width:90%;overflow:hidden;white-space:nowrap}
.cal .c.out{visibility:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .card{padding:10px 12px}
.stats .v{font-family:"Barlow Condensed";font-size:30px;font-weight:800;line-height:1}
.fab{position:fixed;right:16px;bottom:20px;z-index:40;border:0;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-family:"Barlow Condensed";font-weight:800;font-size:18px;padding:13px 18px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:flex;align-items:center;gap:6px}
.tbox{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px 22px;max-width:560px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.tbox .clock{font-family:"Barlow Condensed";font-size:64px;font-weight:800;text-align:center;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tbox .clock.done{color:var(--acc)}
.tbar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin:6px 0 12px}

/* ---------- storage (Supabase, with an offline copy on the phone) ---------- */
const SB_URL = "https://smkoclsxwtyfzwslzqwe.supabase.co";
const SB_KEY = "sb_publishable_hamyZXuqbVzFy_V0IvHXWg_nD4bHq_S";
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const SB_AUTH_KEY = "sb-smkoclsxwtyfzwslzqwe-auth-token";
const CACHE_KEY = "gym-cache";
function blobToB64(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });

function sbErr(error) { const e = new Error(error && error.message || "db"); e.code = error && error.code; return e; }

  mode: "local", uid: null, email: null, assets: null, sample: null, mcp: null, owner: false,
  async init() {

  async loadAll() {

      if (c && navigator.onLine === false) return fromCache();

/* ---------- state ---------- */

  profile: { height: null, weights: [], name: "" } };

const saveTimers = {}, inflight = {}, dirty = {};

  const m = pendingMap(); if (obj) m[id] = obj; else delete m[id];

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
let retryTimer = null;

  clearTimeout(retryTimer); retryTimer = setTimeout(retryAll, 15000);
}
function retryAll() {
  clearTimeout(retryTimer);

  for (const id of Object.keys(m)) { if (id === "profile") { saveProfile.retrying = true; saveProfile().finally(() => saveProfile.retrying = false); }
    else if (id === "activities") { saveActs.retrying = true; saveActs().finally(() => saveActs.retrying = false); } else if (S.routines[id]) flush(id); else setPending(id, null); }

window.addEventListener("online", () => setTimeout(retryAll, 800));
window.addEventListener("offline", () => { if (Object.keys(pendingMap()).length) wentOffline(); });

function scheduleSave(id) {
  const r = S.routines[id]; if (r) { r.updatedAt = Date.now(); setPending(id, r); }

}

/* ---------- image helpers ---------- */
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);

      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);

function exLog(r, w, exId) { const wl = weekLog(r, w); wl[exId] = wl[exId] || { kg: [], reps: [] }; return wl[exId]; }

  const ws = r.weeks.map(x => x.n).filter(n => n < w).sort((a, b) => b - a);

  const name = normName(findEx(r, exId).name); if (!name) return null;
  const older = Object.values(S.routines).filter(o => o.id !== r.id && (o.createdAt || 0) < (r.createdAt || 0))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    for (const d of o.days) for (const e of d.exercises) {

function normName(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
function seriesAll(r, exId) {
  const name = normName(findEx(r, exId).name);

    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

function videoUrl(e) {
  if (e.video && /^https?:\/\//i.test(e.video)) return e.video;
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(`cómo hacer ${e.name} técnica correcta`);
}
function maxReps(l) { const v = (l?.reps || []).map(num).filter(x => x != null); return v.length ? Math.max(...v) : null; }
// Bodyweight (PC) exercises progress by reps; the rest by kilos
function metric(e, l) { return e && e.bw ? maxReps(l) : maxKg(l); }
const unitOf = e => e && e.bw ? "reps" : "kg";
function hasData(l) { return !!l && ((l.kg || []).some(v => num(v) != null) || (l.reps || []).some(v => num(v) != null)); }
function maxKg(l) { const v = (l?.kg || []).map(num).filter(x => x != null); return v.length ? Math.max(...v) : null; }
function series(r, exId) {
  const e = findEx(r, exId); return r.weeks.slice().sort((a, b) => a.n - b.n).map(w => metric(e, r.logs?.[w.n]?.[exId])).filter(v => v != null);
}
function spark(vals) {
  if (vals.length < 2) return "";
  const W = 84, H = 26, mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [i * (W - 6) / (vals.length - 1) + 3, H - 3 - (v - mn) / rg * (H - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" style="stroke:var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" style="fill:var(--acc)"/></svg>`;
}
function normalizeDays(days) {
  return (days || []).map((d, i) => ({
    id: d.id || uid("d"), name: String(d.name || d.nombre || `Día ${i + 1}`),
    exercises: (d.exercises || d.ejercicios || []).map(e => ({
      id: e.id || uid("e"), name: String(e.name || e.nombre || "").trim(),
      series: parseInt(e.series ?? e.sets) || null, reps: String(e.reps ?? e.repeticiones ?? "").trim(),
      notes: String(e.notes ?? e.notas ?? "").trim(),
      video: /^https?:\/\//i.test(String(e.video || "").trim()) ? String(e.video).trim() : "",
      group: String(e.group ?? e.bloque ?? "").trim(),
      bw: !!(e.bw ?? e.pc)
    })).filter(e => e.name)
  })).map(d => ({ ...d, exercises: orderByGroup(d.exercises) })).filter(d => d.exercises.length || d.name);
}
// Keep exercises with the same block number together (1 with 1, 2 with 2...), ordered by block, original order inside a block.
function orderByGroup(exs) {
  let auto = 0;
  exs.forEach(e => { const n = parseFloat(e.group); if (isFinite(n)) auto = Math.max(auto, n); });
  const keyed = exs.map((e, i) => {
    if (!e.group) e.group = String(++auto);
    const n = parseFloat(e.group);
    if (isWarm(e.group)) return { e, i, k: -1 };
    return { e, i, k: isFinite(n) ? n : 1e6 + exs.findIndex(x => x.group === e.group) };
  });
  return keyed.sort((a, b) => a.k - b.k || a.i - b.i).map(x => x.e);
}
function isWarm(g) { return /^\s*(c|cal|calentamiento|•|\.)/i.test(String(g || "")); }
function blocksOf(exs) {
  const out = [];
  for (const e of exs) {
    const g = isWarm(e.group) ? "C" : (e.group || e.id), last = out[out.length - 1];
    if (last && last.g === g) last.items.push(e); else out.push({ g, items: [e] });
  }
  return out;
}

async function doAuth(kind) {
  const L = S.login; const email = ($("#lg-email").value || "").trim(), pass = $("#lg-pass").value || "";
  L.email = email; L.ok = false;
  if (!email || pass.length < 6) { L.msg = "Poné tu mail y una contraseña de al menos 6 caracteres."; render(); return; }
  if (navigator.onLine === false) { L.msg = "Para entrar la primera vez necesitás señal."; render(); return; }
  L.busy = true; L.msg = ""; render();
  try {
    if (kind === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (data.session) { location.reload(); return; }
      L.mode = "in"; L.ok = true; L.msg = "¡Listo! Te mandamos un mail para confirmar la cuenta. Tocá el link del mail y después volvé acá y entrá con tu contraseña.";
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      location.reload(); return;
    }
  } catch (e) {
    const m = String(e && e.message || "");
    L.msg = /confirm/i.test(m) ? "Todavía no confirmaste el mail. Buscá el mail de Supabase (fijate en spam) y tocá el link."
      : /invalid login/i.test(m) ? "Mail o contraseña incorrectos."
      : /already registered/i.test(m) ? "Ese mail ya tiene cuenta. Iniciá sesión."
      : /rate|seconds/i.test(m) ? "Demasiados intentos. Esperá un minuto y probá de nuevo."
      : "No se pudo: " + m;
  }
  L.busy = false; render();
}

let profBusy = false, profDirty = false;
async function saveProfile() {
  if (profBusy) { profDirty = true; return; }
  if (!saveProfile.retrying) { S.profile.updatedAt = Date.now(); setPending("profile", S.profile); }
  profBusy = true; setStatus(S.offline ? "📴 Sin señal · guardado en el celu" : "Guardando…", true);
  const stamp = S.profile.updatedAt;
  try {
    await withTimeout(store.putProfile(S.profile), 10000);
    if (S.profile.updatedAt === stamp && !profDirty) setPending("profile", null);
    const wasOff = S.offline; S.offline = false; setStatus(wasOff ? "☁️ Volvió la señal · todo sincronizado" : "Guardado ✓");
  } catch { wentOffline(); }
  profBusy = false; if (profDirty) { profDirty = false; saveProfile(); }
}

function viewRoutine() {
  const r = S.routines[S.cur]; if (!r) { S.view = "home"; return viewHome(); }
  const weeks = r.weeks.slice().sort((a, b) => a.n - b.n);
  const w = S.week; const wk = weeks.find(x => x.n === w);
  const day = r.days[S.day] || r.days[0];
  const src = photoSrc(r);
  const exHtml = !day ? `<p class="mute">Esta rutina no tiene ejercicios. Tocá editar para agregarlos.</p>` :
    blocksOf(day.exercises).map((b, bi) => {
      const cards = b.items.map(e => exCard(r, w, e, b)).join("");
      if (b.g === "C") return `<div class="ss" style="--ssc:#8d939a"><div class="ss-head"><span class="t">Calentamiento</span><span class="mute small">· antes de arrancar</span></div>${cards}</div>`;

function exCard(r, w, e, b) {

          <div class="presc">${esc(presc)}</div></div>

        <div class="ex-foot">

/* ---------- actions ---------- */
function autoBodyweight(r) {
  let changed = false;
  for (const d of r.days) for (const e of d.exercises) {
    if (e.bw || e.bwChecked) continue;
    const vals = []; for (const w of Object.keys(r.logs || {})) (r.logs[w][e.id]?.kg || []).forEach(v => { if (String(v).trim() !== "") vals.push(num(v)); });
    if (vals.length && vals.every(v => v === 0)) {
      e.bw = true; changed = true;
      for (const w of Object.keys(r.logs)) { const l = r.logs[w][e.id]; if (l) l.kg = (l.kg || []).map(v => num(v) === 0 ? "" : v); }
    }
    if (vals.length) { e.bwChecked = true; changed = true; }
  }
  return changed;
}
function openRoutine(id) {
  const r = S.routines[id];
  if (autoBodyweight(r)) scheduleSave(id); S.cur = id; S.view = "routine"; S.day = 0;
  if (!r.weeks.length) { r.weeks.push({ n: 1, start: today() }); scheduleSave(id); }
  S.week = Math.max(...r.weeks.map(w => w.n));
  render();
}
function newDraft() { S.draft = { file: null, preview: null, name: "", days: [], busy: null, error: null }; S.view = "new"; render(); }

async function readSheet() {
  const d = S.draft; if (!d.file || !store.sample) return;
  if (navigator.onLine === false) { d.error = "Para leer la foto necesitás señal. Probá cuando tengas internet o cargala a mano."; render(); return; }
  d.busy = "Leyendo la planilla…"; d.error = null; render();
  try {
    let lim = null; try { lim = await store.sample.limits(); } catch {}
    if (lim && !lim.images) throw new Error("noimg");
    const { blob } = await shrink(d.file, 1600, 0.85);
    const prompt = `Sos un asistente que lee planillas de rutinas de gimnasio (pueden ser manuscritas, en español).
Mirá la imagen y extraé TODOS los ejercicios, agrupados por día si la planilla tiene días (Día 1, Lunes, A/B, etc.). Si no hay días, usá un solo día llamado "Día 1".
Para cada ejercicio: nombre (corregí la ortografía obvia y escribilo con mayúscula inicial), series (número entero o null), reps (texto tal cual, ej "12", "12-10-8", "30 seg") notas (descansos, técnica, peso indicado; "" si no hay) y bloque.
BLOQUE / SUPERSERIES: en la planilla los ejercicios tienen un número de orden (1, 2, 3…). Si dos o más ejercicios del mismo día tienen el MISMO número (ej: dos con "1"), o están unidos por una llave, un corchete o el mismo color, forman una superserie y llevan el mismo "bloque". Copiá el número tal cual figura. Si no hay número, numerá en orden de aparición, respetando que los del mismo color o unidos compartan bloque.
Mantené el orden en que están escritos.
PLANILLAS IMPRESAS CON CATÁLOGO (ej. Genesis Gym): la hoja trae impresa una lista larga de ejercicios por grupo muscular (Pecho, Espalda, Hombros, Bíceps, Tríceps, Muslos, Abdominales…). SOLO cuentan los ejercicios marcados por el profe (con número, palito, punto o resaltado, y/o con series y reps escritas a mano). Ignorá los demás.
- Los DÍAS se distinguen por el COLOR del resaltado o del número; abajo, en "RUTINA DIVIDIDA", cada Día I/II/III tiene su color y a veces un nombre (Empuje, Tracción, Piernas…). Usá ese nombre: "Día I - Empuje". Las marcas en birome sin color (palitos I, II, III, IIII, o números romanos) suelen ser otro día: agrupalas juntas.
- Un día puede mezclar ejercicios de varios grupos musculares: juntalos todos en el mismo día ordenados por su número. El número se repite entre grupos (ej. un "2" en Pecho y otro "2" en Tríceps del mismo color) = superserie.
- Los ejercicios con punto (•) en vez de número (abdominales, espinales) son el CALENTAMIENTO: van al PRINCIPIO del día de su color, con bloque "C". Si el punto no tiene color, ponelo en el día de las marcas en birome.
- S = series, R = reps. Lo escrito a mano suele quedar un poco más abajo que la fila impresa: asigná cada número al ejercicio marcado más cercano. "F" = al fallo, "c/u" o "c/p" = cada lado, (+3") o +5" = pausa.
- PESO CORPORAL: si el ejercicio se hace con el propio cuerpo (dominadas, flexiones, fondos, paralelas, TRX, planchas, abdominales, estocadas sin carga) o dice "PC", poné "pc": true; si no, "pc": false.
- Si hay una variante redondeada (ej. "Barra-Manc" con "Manc" redondeado, "Acost-Sent" con "Sent" redondeado), incluila en el nombre: "Vuelos laterales con mancuernas". Otras anotaciones a mano (lento, 1B, sent.) van a notas.
Respondé SOLO con JSON válido, sin texto extra, con esta forma:
{"nombre":"nombre corto de la rutina o \\"\\"","dias":[{"nombre":"Día 1","ejercicios":[{"nombre":"Sentadilla","series":4,"reps":"10","notas":"","bloque":"1"},{"nombre":"Remo con barra","series":4,"reps":"10","notas":"","bloque":"2"},{"nombre":"Fondos","series":4,"reps":"12","notas":"","bloque":"2"}]}]}`;
    const res = await store.sample(prompt, { images: [blob], modelTier: "complex" });
    const txt = res.text || ""; const m = txt.match(/\{[\s\S]*\}/);
    if (!m) throw new Error("parse");
    const j = JSON.parse(m[0]);

  } catch (e) {
    d.busy = null;
    d.error = e && e.code === "not_granted" ? "No diste permiso para leer la imagen. Podés cargarla a mano."
      : e && e.code === "rate_limited" ? "Demasiados intentos seguidos. Esperá un minuto y probá de nuevo."
      : e && e.code === "no_key" ? "La lectura por foto todavía no está activada. Por ahora cargala a mano."
      : e && e.message === "noimg" ? "La lectura de imágenes no está disponible ahora. Cargala a mano."
      : e && e.message === "empty" ? "No encontré ejercicios en la foto. Probá con una foto más nítida y derecha, o cargala a mano."

}

const localDate = d => { const x = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return x.toISOString().slice(0, 10); };
function progressIndex() {

  const P = Array.from({ length: 160 }, (_, i) => {
    const side = i % 2 ? 1 : -1;
    return { x: side > 0 ? innerWidth + 10 : -10, y: innerHeight * (0.55 + Math.random() * 0.3),
      vx: -side * (4 + Math.random() * 7), vy: -(9 + Math.random() * 9), r: 4 + Math.random() * 5,
      a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[i % cols.length], sq: Math.random() < .5 };
  });
  const start = performance.now();
  (function frame(t) {
    const el = t - start; g.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) { p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.globalAlpha = Math.max(0, 1 - el / 3200); g.fillStyle = p.c;
      if (p.sq) g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); else { g.beginPath(); g.arc(0, 0, p.r / 2.2, 0, 6.3); g.fill(); }
      g.restore(); }
    if (el < 3200) requestAnimationFrame(frame); else c.remove();
  })(start);
}

/* ---------- motivational header ---------- */
const MOTTOS = [
  "Hoy se *entrena*, mañana se presume",
  "Un kilo más que la semana *pasada*",
  "La constancia le gana al *talento*",
  "No pares hasta estar *orgulloso*",
  "El único mal entreno es el que *no hiciste*",
  "Cada serie *cuenta*",
  "Disciplina > *motivación*",
  "Tu yo del mes que viene te lo va a *agradecer*",
  "Menos excusas, más *repeticiones*",
  "Lento pero *sin aflojar*",
  "Hoy toca dejar todo en el *gym*",
  "Al fallo, pero con *técnica*",
  "Paso a paso, kilo a *kilo*",
  "Lo difícil hoy es *fácil* mañana",
  "Entrená como si nadie te *mirara*",
  "Ganas o no, se *va*",
  "Superate a vos mismo, *nadie más*",
  "El progreso no se negocia: se *carga*"
];
let mottoShift = 0;
function firstName() { const n = (S.profile.name || "").trim(); return n ? n.split(/\s+/)[0] : ""; }
function mottoText() {
  const n = firstName(); const days = attendanceDays(); const td = today();
  const ctx = [];
  if (days[td]) ctx.push(`Hoy ya ${n ? "cumpliste, " + n : "cumpliste"}. *Bien ahí* 💪`);
  const st = streak(days); if (st >= 2) ctx.push(`${st} semanas seguidas: *no aflojes* 🔥`);
  // records this week
  let recs = 0; for (const r of Object.values(S.routines)) { const w = Math.max(0, ...r.weeks.map(x => x.n));
    for (const d of r.days) for (const e of d.exercises) { const c = metric(e, r.logs?.[w]?.[e.id]), b = bestBefore(r, w, e); if (c != null && b != null && c > b) recs++; } }
  if (recs) ctx.push(`${recs} récord${recs > 1 ? "s" : ""} esta semana. *Máquina* 🏆`);
  const pool = ctx.concat(MOTTOS);
  const dayNum = Math.floor(Date.now() / 864e5);
  const i = ctx.length && mottoShift === 0 ? 0 : (dayNum + mottoShift) % pool.length;
  return pool[i];
}
function mottoHtml() {
  const h = new Date().getHours(); const n = firstName();
  const hi = (h < 12 ? "Buen día" : h < 20 ? "Buenas tardes" : "Buenas noches") + (n ? ", " + n : "");
  const t = esc(mottoText()).replace(/\*(.+?)\*/g, "<em>$1</em>");
  return `<div class="motto" data-a="motto"><div class="who">${esc(hi)}</div><h1>${t}</h1></div>`;
}

/* ---------- hero ---------- */
const HERO_ART = `<svg class="art" viewBox="0 0 220 90" aria-hidden="true">
  <rect x="38" y="40" width="144" height="10" rx="3" style="fill:var(--mute)"/>
  <rect x="6" y="28" width="12" height="34" rx="3" style="fill:var(--acc);opacity:.55"/>
  <rect x="18" y="14" width="14" height="62" rx="4" style="fill:var(--acc)"/>
  <rect x="32" y="24" width="8" height="42" rx="3" style="fill:var(--acc);opacity:.8"/>
  <rect x="180" y="24" width="8" height="42" rx="3" style="fill:var(--acc);opacity:.8"/>
  <rect x="188" y="14" width="14" height="62" rx="4" style="fill:var(--acc)"/>
  <rect x="202" y="28" width="12" height="34" rx="3" style="fill:var(--acc);opacity:.55"/>
  <rect x="96" y="38" width="28" height="14" rx="3" style="fill:var(--text);opacity:.25"/>
</svg>`;
function nextDay(r) {
  if (!r || !r.days.length) return 0;
  const ss = Object.entries(r.sessions || {}).sort((a, b) => a[0] < b[0] ? -1 : 1);
  if (!ss.length) return 0;
  const [lastDate, lastName] = ss[ss.length - 1];
  const i = r.days.findIndex(d => d.name === lastName);
  if (lastDate === today()) return Math.max(0, i);
  return i < 0 ? 0 : (i + 1) % r.days.length;
}
function heroCard() {
  const r = sortedRoutines()[0];
  const h = new Date().getHours();
  const hi = h < 12 ? "Buen día" : h < 20 ? "Buenas tardes" : "Buenas noches";
  if (!r) return `<div class="hero"><div class="stripes"></div>${HERO_ART}<div class="hi">Primer paso</div><div class="today">Arrancamos<br><em>tu rutina</em></div></div>`;
  const di = nextDay(r); const dn = r.days[di]?.name || "";
  const done = (r.sessions || {})[today()] != null;
  return `<div class="hero"><div class="stripes"></div>${HERO_ART}
    <div class="hi">${done ? "Hoy ya entrenaste 💪" : "Hoy toca"}</div>
    <div class="today">${esc(dn.split(/\s+-\s+/)[0])}${dn.includes(" - ") ? `<br><em>${esc(dn.split(/\s+-\s+/).slice(1).join(" - "))}</em>` : ""}</div>
    <button class="btn acc sm" data-a="go-today" data-id="${r.id}" data-i="${di}">${done ? "Seguir cargando" : "Empezar"} →</button></div>`;
}

/* ---------- boot ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  await store.init();
  try {
    const { routines, profile, activities } = await store.loadAll();
    if (activities && Array.isArray(activities.list)) S.acts = { list: activities.list, updatedAt: activities.updatedAt || 0 };
    for (const r of routines) S.routines[r.id] = { weeks: [], logs: {}, days: [], ...r };
    if (profile) S.profile = { height: profile.height ?? null, weights: Array.isArray(profile.weights) ? profile.weights : [], manualDays: Array.isArray(profile.manualDays) ? profile.manualDays : [], theme: profile.theme || null, name: profile.name ?? (store.owner ? "Jeremías" : ""), badges: Array.isArray(profile.badges) ? profile.badges : [], updatedAt: profile.updatedAt || 0 };
    if (profile && profile.theme && THEMES[profile.theme]) { applyTheme(profile.theme); try { localStorage.setItem("gym-theme", profile.theme); } catch {} }
  }
  catch (e) { S.loadErr = "No pude cargar tus datos todavía. Revisá la conexión y volvé a abrir."; }
  // Changes made without signal on an earlier visit win if they are newer than what the cloud has
  const pend = pendingMap(); let restored = 0;
  for (const [id, obj] of Object.entries(pend)) {
    if (!obj) continue;
    if (id === "activities") { if ((obj.updatedAt || 0) > (S.acts.updatedAt || 0)) { S.acts = obj; restored++; } else setPending(id, null); continue; }
    if (id === "profile") { if ((obj.updatedAt || 0) > (S.profile.updatedAt || 0)) { S.profile = { ...S.profile, ...obj }; restored++; } else setPending(id, null); }
    else if (!S.routines[id] || (obj.updatedAt || 0) > (S.routines[id].updatedAt || 0)) { S.routines[id] = { weeks: [], logs: {}, days: [], ...obj }; restored++; }
    else setPending(id, null);
  }
  if (restored && !S.loadErr) setTimeout(retryAll, 1500);
  S.ready = true; render(); updateMeta();
})();
</script>
